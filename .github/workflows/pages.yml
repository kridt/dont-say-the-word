name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# configure-pages turns Pages on by itself the first time this runs,
# so the site never has to be enabled by hand in Settings.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Statisk side uden byggetrin — hele roden serveres, som den er.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
